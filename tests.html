<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tests — Dashboard Ualá</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; padding:24px; }
    h1 { font-size:1.2rem; }
    #resumen { font-size:1.1rem; font-weight:bold; margin-bottom:16px; }
    #resumen.ok { color:#22c55e; }
    #resumen.fail { color:#ef4444; }
    .t { padding:6px 10px; border-radius:6px; margin-bottom:4px; font-size:0.9rem; }
    .t.ok { background:rgba(34,197,94,0.12); color:#22c55e; }
    .t.fail { background:rgba(239,68,68,0.12); color:#ef4444; }
    small { color:#94a3b8; }
  </style>
</head>
<body>
  <h1>Tests — Dashboard Ualá</h1>
  <div id="resumen"></div>
  <div id="resultados"></div>

  <script src="js/test-runner.js"></script>
  <script src="js/propuesta-core.js"></script>
  <script src="js/refinanciacion-core.js"></script>
  <script>
    const C = window.PropuestaCore;

    test("parseMonto lee los centavos de cualquier forma de escribirlos", () => {
      assertEq(C.parseMonto("950.000,33"), 950000.33);
      assertEq(C.parseMonto("950000,33"), 950000.33);
      assertEq(C.parseMonto("950000.33"), 950000.33, "punto + 2 dígitos es decimal, no 95.000.033");
      assertEq(C.parseMonto("950.000"), 950000, "punto de miles");
      assertEq(C.parseMonto("$ 1.234.567,5"), 1234567.5);
      assertEq(Number.isNaN(C.parseMonto("")), true);
    });

    test("pesosArriba sube siempre al peso entero y no se deja engañar por el float", () => {
      assertEq(C.pesosArriba(950000.33), 950001);
      assertEq(C.pesosArriba(950000), 950000);
      assertEq(C.pesosArriba(0.01), 1);
      assertEq(C.pesosArriba(1000 * (100 - 30) / 100), 700, "sin ruido de coma flotante");
      assertEq(C.pesosArriba(C.parseMonto("100.000,10") * (100 - 10) / 100), 90001);
    });

    test("un saldo con centavos se cobra siempre al peso de arriba", () => {
      const datos = { saldoTotal: 950000.33, capital: 500000.5, diasMora: 200, tipo: "prestamo" };
      const pago = C.opcionesQuita(datos).pagoUnico.opciones.find((o) => o.esPagoTotal);
      assertEq(pago.montoTotal, 950001, "pago total");
      C.opcionesQuita(datos).pagoUnico.opciones.forEach((o) =>
        assertEq(Number.isInteger(o.montoTotal), true, "monto entero en " + o.id));
      C.opcionesCuotas(datos).opciones.forEach((o) =>
        assertEq(o.valorCuota, Math.ceil(o.totalObjetivo / o.cuotas), "valorCuota en " + o.id));
    });

    test("refinanciación: cuota y anticipo con centavos suben al peso entero", () => {
      const m = window.RefinanciacionCore.armarPropuesta({
        nombre: "Ana", prestamos: 1, cuotificaciones: 0, montoTotal: 100000.5, cuotas: 12,
        valorCuota: 9999.2, anticipo: 5000.01, fecha: "2026-12-01", operador: "Op"
      });
      assertIncluye(m, "12 cuotas de $10.000.-");
      assertIncluye(m, "Anticipo para activarla: $5.001.-");
    });

    mostrarResultados();
  </script>
</body>
</html>
